<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBE / threat to everyone</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body {
            background-color: #080808;
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.65)), url('background.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow-x: hidden; padding-top: 60px;
        }
        header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center; padding: 10px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
        }
        .nav-logo-area { display: flex; align-items: center; height: 35px; }
        .nav-logo-area img { height: 100%; width: auto; object-fit: contain; }
        .nav-right-container { display: flex; align-items: center; gap: 35px; }
        nav { display: flex; align-items: center; gap: 30px; }
        nav a { color: #a0a0a0; text-decoration: none; font-size: 0.8rem; letter-spacing: 1.5px; text-transform: uppercase; transition: color 0.2s ease; }
        nav a:hover, nav a.active { color: #ffffff; font-weight: 500; }
        .visitor-counter { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; letter-spacing: 1.5px; color: #888; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 6px 12px; text-transform: uppercase; }
        .visitor-counter span { color: #fff; font-weight: 500; }
        .hero-section { display: flex; justify-content: center; align-items: flex-start; gap: 70px; padding: 40px 25px 80px 25px; width: 100%; max-width: 1300px; margin: 0 auto; min-height: calc(100vh - 120px); }
        .layout-left { display: flex; flex-direction: column; align-items: flex-start; gap: 35px; width: 48%; }
        .giant-pbe-logo { width: 100%; max-width: 620px; text-align: left; }
        .giant-pbe-logo img { width: 100%; height: auto; object-fit: contain; filter: drop-shadow(0 0 45px rgba(255, 255, 255, 0.45)); }
        .spotify-card { width: 100%; max-width: 620px; background: rgba(12, 12, 12, 0.95); border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); padding: 26px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .spotify-header { font-size: 0.8rem; letter-spacing: 2px; color: #888; text-transform: uppercase; margin-bottom: 12px; font-style: italic; font-weight: 600; }
        .song-info-area { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 15px; }
        .album-art-small { width: 90px; height: 90px; background: #1a1a1a; border: 1px solid rgba(255, 255, 255, 0.15); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 5px; }
        .album-art-small img { width: 100%; height: 100%; object-fit: contain; }
        .wide-banner-thumb { flex-grow: 1; height: 90px; background: #111; border: 1px solid rgba(255, 255, 255, 0.15); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .wide-banner-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .player-interface { display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); padding: 16px 24px; }
        .play-btn { background: #ffffff; color: #000000; border: none; padding: 14px 32px; font-weight: 900; font-size: 0.85rem; letter-spacing: 2px; cursor: pointer; transition: opacity 0.2s; }
        .play-btn:hover { opacity: 0.85; }
        .player-meta { display: flex; align-items: center; gap: 18px; font-size: 0.75rem; letter-spacing: 1.5px; color: #888; text-transform: uppercase; }
        .mini-progress-bar { width: 150px; height: 3px; background: #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.6); transition: height 0.1s ease; }
        .layout-right { display: flex; flex-direction: column; gap: 15px; width: 44%; align-items: flex-end; text-align: right; }
        .threat-title { font-family: 'Anton', sans-serif; font-size: clamp(3.5rem, 6vw, 6.5rem); font-weight: 400; letter-spacing: 1.5px; text-transform: lowercase; color: #ffffff; line-height: 0.95; text-shadow: 3px 3px 0px rgba(0, 0, 0, 1), -2px -2px 0px rgba(0, 0, 0, 1), 0 0 25px rgba(255, 255, 255, 0.35); }
        .quote-text { font-size: 0.75rem; font-weight: 300; letter-spacing: 1.5px; color: #777; text-transform: lowercase; margin-top: 5px; }
        .profiles-section { width: 100%; max-width: 1200px; margin: 0 auto; padding: 60px 20px 100px 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .profiles-main-title { font-family: 'Anton', sans-serif; font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 400; letter-spacing: 1.5px; text-transform: lowercase; color: #ffffff; margin-bottom: 50px; text-align: center; text-shadow: 3px 3px 0px rgba(0, 0, 0, 1); }
        .section-container { width: 100%; margin-bottom: 50px; }
        .section-heading { font-family: 'Anton', sans-serif; font-size: 1.8rem; letter-spacing: 2px; text-transform: uppercase; color: #fff; margin-bottom: 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); padding-bottom: 8px; }
        .profiles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; }
        
        .profile-card { background: rgba(12, 12, 12, 0.9); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); padding: 16px 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.7); border-radius: 6px; }
        .avatar-container { position: relative; width: 50px; height: 50px; flex-shrink: 0; }
        .avatar-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.2); }
        .status-dot { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #0c0c0c; }
        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f23f43; }
        .status-offline { background-color: #80848e; }
        .profile-details { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
        .profile-name { font-size: 0.9rem; font-weight: 700; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
        .profile-status { font-size: 0.7rem; color: #888; letter-spacing: 0.5px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        footer { padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.75rem; letter-spacing: 1.5px; color: #666; text-transform: uppercase; background: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>

    <audio id="audioPlayer" src="lv_0_20260809194350.mp3" autoplay loop></audio>

    <header>
        <div class="nav-logo-area">
            <img src="logo.png" alt="PBE Logo">
        </div>
        <div class="nav-right-container">
            <nav>
                <a href="#home" class="active">Home</a>
                <a href="#profiles">Profiles</a>
                <a href="https://discord.gg/zHGBSdf4BQ" target="_blank">Discord</a>
            </nav>
            <div class="visitor-counter">Views: <span id="viewCount">1,433</span></div>
        </div>
    </header>

    <section class="hero-section" id="home">
        <div class="layout-left">
            <div class="giant-pbe-logo">
                <img src="hero-logo.png" alt="PBE Logo">
            </div>
            <div class="spotify-card">
                <div class="spotify-header">TAKOT</div>
                <div class="song-info-area">
                    <div class="album-art-small">
                        <img src="hero-logo.png" alt="Thumb">
                    </div>
                    <div class="wide-banner-thumb">
                        <img src="scene.jpg" alt="Scene">
                    </div>
                </div>
                <div class="player-interface">
                    <button class="play-btn" id="playBtn" onclick="togglePlay()">PAUSE</button>
                    <div class="player-meta"><span>STATUS</span><div class="mini-progress-bar" id="beatBar"></div><span>ONLINE</span></div>
                </div>
            </div>
        </div>
        <div class="layout-right">
            <h1 class="threat-title">threat to everyone</h1>
            <div class="quote-text">we dont start shit, we finish it.</div>
        </div>
    </section>

    <section class="profiles-section" id="profiles">
        <h1 class="profiles-main-title">collective roster</h1>
        <div class="section-container">
            <h2 class="section-heading">Founders</h2>
            <div class="profiles-grid" id="founders-grid"></div>
        </div>
        <div class="section-container">
            <h2 class="section-heading">Threats</h2>
            <div class="profiles-grid" id="threats-grid"></div>
        </div>
        <div class="section-container">
            <h2 class="section-heading">Enemies</h2>
            <div class="profiles-grid" id="enemies-grid"></div>
        </div>
    </section>

    <footer>
        <div>Public Enemy Collective © 2026</div>
        <div>All Rights Reserved</div>
    </footer>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const beatBar = document.getElementById('beatBar');

        function togglePlay() {
            if (audio.paused) { audio.play().catch(() => {}); playBtn.textContent = 'PAUSE'; }
            else { audio.pause(); playBtn.textContent = 'PLAY'; beatBar.style.height = '3px'; }
        }

        document.addEventListener('click', function initAudio() {
            if (audio.paused) { audio.play().catch(() => {}); playBtn.textContent = 'PAUSE'; }
            document.removeEventListener('click', initAudio);
        }, { once: true });

        setInterval(() => {
            if (!audio.paused) {
                beatBar.style.height = (Math.floor(Math.random() * 12) + 3) + 'px';
            } else { beatBar.style.height = '3px'; }
        }, 100);

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('viewCount').textContent = (1433 + Math.floor(Math.random() * 5)).toLocaleString();
            loadProfiles();
        });

        const founders = ['1045740438147051541', '516925138407653386', '1393821550142296145', '1162109122242691082'];
        const threats = ['1512087904715800629', '1473659382800584855', '1492561000782893088', '1407329376063979550', '1313118367439130624', '1450026770186240080'];
        const enemies = ['1333235917259014248', '1429645202930274407', '1469138009042718762', '1543579909060956192', '1417155995460829246', '1494609700258447503', '1538721869061169282', '543782681796804629', '1459753290433564724', '1437066666411556984', '1181148533991157854'];

        async function fetchDiscordUser(userId, containerId) {
            const container = document.getElementById(containerId);
            const card = document.createElement('div');
            card.className = 'profile-card';
            card.innerHTML = `
                <div class="avatar-container">
                    <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
                    <div class="status-dot status-offline"></div>
                </div>
                <div class="profile-details">
                    <span class="profile-name">PBE Member</span>
                    <span class="profile-status">Connecting...</span>
                </div>
            `;
            container.appendChild(card);

            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
                const data = await response.json();

                if (data.success && data.data) {
                    const user = data.data;
                    const discordUser = user.discord_user;
                    const avatarUrl = discordUser.avatar 
                        ? `https://cdn.discordapp.com/avatars/${discordUser.id}/${discordUser.avatar}.png` 
                        : 'https://cdn.discordapp.com/embed/avatars/0.png';
                    
                    let statusText = user.discord_status || 'offline';
                    if (user.spotify) {
                        statusText = `🎵 ${user.spotify.song}`;
                    } else if (user.activities && user.activities.length > 0) {
                        const game = user.activities.find(a => a.type === 0);
                        if (game) statusText = `🎮 ${game.name}`;
                    }

                    card.innerHTML = `
                        <div class="avatar-container">
                            <img src="${avatarUrl}" alt="${discordUser.username}">
                            <div class="status-dot status-${user.discord_status || 'offline'}"></div>
                        </div>
                        <div class="profile-details">
                            <span class="profile-name">${discordUser.username}</span>
                            <span class="profile-status">${statusText}</span>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="avatar-container">
                            <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
                            <div class="status-dot status-offline"></div>
                        </div>
                        <div class="profile-details">
                            <span class="profile-name">User ${userId.slice(-4)}</span>
                            <span class="profile-status">Offline</span>
                        </div>
                    `;
                }
            } catch (error) {
                card.querySelector('.profile-status').textContent = 'Offline';
            }
        }

        function loadProfiles() {
            founders.forEach(id => fetchDiscordUser(id, 'founders-grid'));
            threats.forEach(id => fetchDiscordUser(id, 'threats-grid'));
            enemies.forEach(id => fetchDiscordUser(id, 'enemies-grid'));
        }
    </script>
</body>
</html>

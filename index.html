        .spotify-card {
            width: 100%; max-width: 620px; background: rgba(12, 12, 12, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); padding: 26px; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .spotify-header { font-size: 0.8rem; letter-spacing: 2px; color: #888; text-transform: uppercase; margin-bottom: 12px; font-style: italic; font-weight: 600; }
        .song-info-area { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 15px; }
        .album-art-small { width: 90px; height: 90px; background: #1a1a1a; border: 1px solid rgba(255, 255, 255, 0.15); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 5px; }
        .album-art-small img { width: 100%; height: 100%; object-fit: contain; }
        .wide-banner-thumb { flex-grow: 1; height: 90px; background: #111; border: 1px solid rgba(255, 255, 255, 0.15); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .wide-banner-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .player-interface { display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); padding: 16px 24px; }

            letter-spacing: 1.5px; text-transform: lowercase; color: #ffffff; line-height: 0.95;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 1), -2px -2px 0px rgba(0, 0, 0, 1), 0 0 25px rgba(255, 255, 255, 0.35), 0 5px 30px rgba(0, 0, 0, 0.9);
        }
        .quote-text { font-size: 0.75rem; font-weight: 300; letter-spacing: 1.5px; color: #777; text-transform: lowercase; margin-top: 5px; }
        footer { padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.75rem; letter-spacing: 1.5px; color: #666; text-transform: uppercase; background: rgba(0, 0, 0, 0.5); }

</head>
<body>
    <audio id="audioPlayer" src="lv_0_20260809194350.mp3" autoplay loop></audio>

    <main>
        <div class="layout-left">
            <div class="giant-pbe-logo">
                <img src="https://media.discordapp.net/attachments/1375129451175608402/1558185348985528390/content.png?ex=6aca84b0&is=6ac93330&hm=8f341f092d7b5230a2726af6685e6feb6e41d4313d3a4ff8b3f435184e874104&=&format=webp&quality=lossless&width=1536&height=769" alt="PBE Logo">
            </div>

            <div class="spotify-card">
                <div class="spotify-header">TAKOT</div>
                <div class="song-info-area">
                    <div class="album-art-small">
                        <img src="https://media.discordapp.net/attachments/1375129451175608402/1558185348985528390/content.png?ex=6aca84b0&is=6ac93330&hm=8f341f092d7b5230a2726af6685e6feb6e41d4313d3a4ff8b3f435184e874104&=&format=webp&quality=lossless&width=1536&height=769" alt="Thumbnail">
                    </div>
                    <div class="wide-banner-thumb">
                        <img src="https://media.discordapp.net/attachments/1375129451175608402/1557773782985478164/content.png?ex=6ac9ae23&is=6ac85ca3&hm=bee6fbcaeda327c8045304f100c30c1af9b44f84dc5267b399bd40cfef8af3c5&=&format=webp&quality=lossless&width=1280&height=722" alt="Scene">

                    <button class="play-btn" id="playBtn" onclick="togglePlay()">PAUSE</button>

            </div>

    <footer>
        <div>Public Enemy Collective © 2026</div>
        <div>All Rights Reserved</div>
    </footer>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const beatBar = document.getElementById('beatBar');

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => { playBtn.textContent = 'PAUSE'; }).catch(e => {});
            } else {
                audio.pause(); playBtn.textContent = 'PLAY'; beatBar.style.height = '3px';
            }
        }

        document.addEventListener('click', function initAudio() {
            if (audio.paused) { audio.play().then(() => { playBtn.textContent = 'PAUSE'; }).catch(e => {}); }
            document.removeEventListener('click', initAudio);
        }, { once: true });

        setInterval(() => {
            if (!audio.paused) {
                const randomHeight = Math.floor(Math.random() * 12) + 3;
                beatBar.style.height = randomHeight + 'px';
            } else { beatBar.style.height = '3px'; }
        }, 100);

        window.addEventListener('DOMContentLoaded', () => {
            let views = 1433 + Math.floor(Math.random() * 5);
            document.getElementById('viewCount').textContent = views.toLocaleString();
        });
    </script>

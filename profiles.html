<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBE / Profiles</title>
    <!-- Import Google Font for Street Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #080808;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.75)), url('https://media.discordapp.net/attachments/1375129451175608402/1557773782985478164/content.png?ex=6ac9ae23&is=6ac85ca3&hm=bee6fbcaeda327c8045304f100c30c1af9b44f84dc5267b399bd40cfef8af3c5&=&format=webp&quality=lossless&width=1280&height=722');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Top Navigation Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .nav-logo-area {
            display: flex;
            align-items: center;
            height: 35px;
            text-decoration: none;
        }

        .nav-logo-area img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        .nav-right-container {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.2s ease;
            background: none;
            border: none;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
            font-weight: 500;
        }

        /* Main Content Area */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            flex-grow: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-title {
            font-family: 'Anton', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: lowercase;
            color: #ffffff;
            margin-bottom: 50px;
            text-align: center;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 1), 
                         0 0 20px rgba(255, 255, 255, 0.25);
        }

        /* Section Styling */
        .section-container {
            width: 100%;
            margin-bottom: 45px;
        }

        .section-heading {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 1);
        }

        /* Profiles Grid */
        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            width: 100%;
        }

        /* Lanyard Badge Card */
        .lanyard-card {
            width: 100%;
            background: rgba(12, 12, 12, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            transition: border-color 0.2s ease;
        }

        .lanyard-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .lanyard-card img {
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 4px;
        }

        /* Bottom Footer Bar */
        footer {
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: #666;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.5);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                padding: 10px 20px;
                flex-direction: column;
                gap: 15px;
            }
            .nav-right-container {
                flex-direction: column;
                gap: 10px;
            }
            nav {
                gap: 15px;
            }
            .profiles-grid {
                grid-template-columns: 1fr;
            }
            footer {
                padding: 20px;
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
